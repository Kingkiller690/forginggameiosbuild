name: iOS Build
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  unity-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

  xcode-build:
    needs: unity-export
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: xcode-project, path: build/iOS }
      # Sign, archive, and upload to TestFlight here — fastlane or
      # rageagainstthepixel/unity-xcode-builder (see below)
